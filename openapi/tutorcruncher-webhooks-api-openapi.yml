openapi: 3.2.0
info:
  title: TutorCruncher Webhooks API
  description: REST API for TutorCruncher, tutoring business management software for agencies, companies, and independent tutors.
  version: '2.0'
  contact:
    name: TutorCruncher
    url: https://tutorcruncher.com
  license:
    name: API documentation - TutorCruncher Terms
    url: https://tutorcruncher.com/terms-and-conditions
servers:
- url: https://app.tutorcruncher.com/api
  description: TutorCruncher API
security:
- tokenAuth: []
tags:
- name: Webhooks
  description: Webhook event catalog (action types).
paths:
  /action-types/:
    get:
      operationId: listActionTypes
      tags:
      - Webhooks
      summary: List webhook action types
      description: Returns the catalog of 150+ action types that can trigger a webhook - the `action` values delivered in the webhook `events` payload.
      responses:
        '200':
          description: List of action types.
components:
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Private API key sent as: Authorization: token <API KEY>'
